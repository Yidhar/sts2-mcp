name: release-validation

on:
  workflow_dispatch:
    inputs:
      live_action_handle:
        description: Operator-reviewed legal action handle prepared on the self-hosted STS2 runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: node -e "const {execSync}=require('node:child_process'); const expected=require('./packages/mcp-server/package.json').packageManager.split('@')[1]; const actual=execSync('npm --version',{encoding:'utf8'}).trim(); if(actual!==expected) throw new Error('npm '+actual+' != '+expected)"
      - run: python tools/contracts/check_contracts.py
      - run: python tools/game_data/verify_manifest.py
      - run: python tools/release/check_versions.py
      - run: python tools/ci/check_dependency_locks.py
      - run: python tools/ci/check_markdown_links.py
      - run: python tools/ci/check_repository.py
      - run: python tools/ci/check_generated.py
      - run: git diff --check
      - run: python -m unittest tools.release.test_build_sbom -v
      - run: python -m unittest tools.release.test_external_evidence -v
      - run: python -m unittest tools.artifacts.test_artifact_tools -v

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      - run: node -e "const {execSync}=require('node:child_process'); const expected=require('./package.json').packageManager.split('@')[1]; const actual=execSync('npm --version',{encoding:'utf8'}).trim(); if(actual!==expected) throw new Error('npm '+actual+' != '+expected)"
      - run: npm ci
      - run: npm run verify:contracts
      - run: npm run typecheck
      - run: npm test

  bridge-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: dotnet run --project mods/sts2-bridge/tests/BridgeCore.Tests/BridgeCore.Tests.csproj --configuration Release

  rl-agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/rl-agent
    env:
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: packages/rl-agent/requirements*.lock
      - run: python -m pip install -r requirements-bootstrap.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m pip check
      - run: python -m ruff check sts2_rl launcher.py launcher_watchdog.py
      - run: python -m mypy sts2_rl
      - run: python -m pytest tests -q -p no:cacheprovider
      - run: python scripts/check_muzero_file_budget.py

  candidate-live-and-evidence:
    needs: [source-gates, mcp-server, bridge-core, rl-agent]
    runs-on: [self-hosted, Windows, sts2, release]
    timeout-minutes: 45
    env:
      STS2_LIVE_SMOKE_ACTION_HANDLE: ${{ inputs.live_action_handle }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Validate protected runner and external promotion evidence
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STS2_DIR)) {
            throw 'The protected self-hosted runner must define STS2_DIR.'
          }
          foreach ($name in @('STS2_RELEASE_PARITY_EVIDENCE', 'STS2_RELEASE_COMPATIBILITY_EVIDENCE')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or -not (Test-Path -LiteralPath $value -PathType Leaf)) {
              throw "The protected runner must provide a readable $name file."
            }
          }
          python .\tools\release\check_external_evidence.py `
            --parity $env:STS2_RELEASE_PARITY_EVIDENCE `
            --compatibility $env:STS2_RELEASE_COMPATIBILITY_EVIDENCE `
            --require-source-commit $env:GITHUB_SHA
      - name: Build exact Bridge candidate without deployment
        shell: pwsh
        run: dotnet build .\mods\sts2-bridge\sts2-bridge.csproj --configuration Release -p:Sts2Deploy=false
      - name: Require the running installation to match the candidate
        shell: pwsh
        run: |
          $builtDll = Resolve-Path '.\mods\sts2-bridge\bin\Release\net9.0\sts2-bridge.dll'
          $installedDll = Join-Path $env:STS2_DIR 'mods\sts2-bridge\sts2-bridge.dll'
          $sourceManifest = Resolve-Path '.\mods\sts2-bridge\sts2-bridge.json'
          $installedManifest = Join-Path $env:STS2_DIR 'mods\sts2-bridge\sts2-bridge.json'
          foreach ($path in @($installedDll, $installedManifest)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required installed Bridge candidate is missing: $path"
            }
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $builtDll).Hash -ne
              (Get-FileHash -Algorithm SHA256 -LiteralPath $installedDll).Hash) {
            throw 'The installed Bridge DLL does not match this checkout candidate.'
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $sourceManifest).Hash -ne
              (Get-FileHash -Algorithm SHA256 -LiteralPath $installedManifest).Hash) {
            throw 'The installed Bridge manifest does not match this checkout candidate.'
          }
      - run: npm ci --prefix packages/mcp-server
      - run: npm run verify:contracts --prefix packages/mcp-server
      - run: npm run typecheck --prefix packages/mcp-server
      - run: npm test --prefix packages/mcp-server
      - run: npm run build --prefix packages/mcp-server
      - name: Execute strict live command and duplicate replay smoke
        shell: pwsh
        run: npm run smoke:test --prefix packages/mcp-server | Tee-Object -FilePath "$env:RUNNER_TEMP\live-command-evidence.json"
      - name: Build candidate bundle, deterministic SBOM, and provenance
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'sts2-release-candidate'
          New-Item -ItemType Directory -Force -Path $candidate | Out-Null
          Copy-Item '.\mods\sts2-bridge\bin\Release\net9.0\sts2-bridge.dll' $candidate
          Copy-Item '.\mods\sts2-bridge\sts2-bridge.json' $candidate
          Copy-Item "$env:RUNNER_TEMP\live-command-evidence.json" $candidate
          Copy-Item $env:STS2_RELEASE_PARITY_EVIDENCE (Join-Path $candidate 'live-headless-parity.json')
          Copy-Item $env:STS2_RELEASE_COMPATIBILITY_EVIDENCE (Join-Path $candidate 'compatibility-window.json')
          npm pack .\packages\mcp-server --pack-destination $candidate
          python .\tools\release\build_sbom.py --output (Join-Path $candidate 'release-sbom.cdx.json')
          $arguments = @('.\tools\release\build_provenance.py', '--require-clean')
          Get-ChildItem -LiteralPath $candidate -File | ForEach-Object {
            $arguments += @('--artifact', $_.FullName)
          }
          $arguments += @('--output', (Join-Path $candidate 'release-provenance.json'))
          python @arguments
      - name: Enforce third-party distribution license approvals
        run: python tools/third_party/check_licenses.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-candidate-and-evidence
          path: ${{ runner.temp }}/sts2-release-candidate
          if-no-files-found: error
