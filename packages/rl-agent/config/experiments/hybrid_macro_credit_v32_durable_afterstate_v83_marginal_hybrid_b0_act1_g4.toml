# Durable Afterstate Macro Credit v8.3 — Un-Diluted Marginal Card-ID V_durable + Hybrid Afterstate V-trace/PPO + Gentle Anchored Combat
# Warm-starts from v7.5 u=10 (22/96 = 22.9%, fl=15.33 on 96-seed B=0 Act-1 benchmark; p_defend_lethal = 96.1%, skip = 3.1%).
# Three core upgrades over v8.2:
# 1. Eliminate 1/N Single-Card & Smith Upgrade Dilution (`enable_marginal_card_id_durable_value = true`,
#    `suppress_full_hp_campfire_heal = true`, `durable_value_lr_scale = 2.5`):
#    Adds an un-diluted marginal per-card sum `sum_{w in deck} card_count_w * marginal_delta(w)` backed by a dedicated
#    trainable `(entity_id, is_upgraded)` embedding inside `durable_deck_*` / `durable_twin_deck_*` (zero-initialized
#    readout for bit-exact step-0 hot-start), amplifying single-card & Campfire Smith deltas ~16-18x while `v_cycle`
#    penalizes deck bloat, and hard-suppressing full-HP (`hp >= max_hp - 1`) Campfire HEAL when Smith is available.
# 2. Reconnect Empirical Trajectory Feedback on Card Reward / Campfire (`hybrid_afterstate_vtrace_alpha = 0.25`,
#    `afterstate_macro_pg_scale = 0.35`, `macro_pg_fallback_scale = 0.0`):
#    Fuses empirical V-trace return residuals into symmetric `Q_hybrid` for MPO and enables clipped policy gradients on
#    afterstate choice steps (`reward`, `rest`, `shop`) relative to the unbiased afterstate baseline while keeping
#    Map & Event steps strictly locked (`macro_pg_fallback_scale = 0.0`).
# 3. Gently Unfreeze Combat with Teacher Trust Anchor on 96-Episode Batches (`roots_per_cohort = 96`,
#    `combat_policy_weight = 0.5`, `combat_value_weight = 1.0`, `combat_entropy_weight = 0.012`,
#    `target_combat_step_kl = 0.004`, `kickstart_kl_floor = 0.015`, `kickstart_combat_kl_scale = 1.0`):
#    Preserves lethal blocking (`p_defend_lethal > 80%`) via 96-game batches + strict 0.004 combat KL line search +
#    teacher KL anchor while relaxing over-defending on 0-damage enemy turns (`p_defend_buff0: 90.6% -> ~40%`).
version = "sts2-synchronous-macro-credit-course-v1"

[course]
roots_per_cohort = 96
seed_index_offset = 860000
parallel_collectors = 48
macro_branch_epsilon = 0.04
crn_roots_per_episode = 0
crn_max_branches_per_root = 4
maximum_root_snapshot_bytes = 536870912
maximum_cohort_snapshot_bytes = 12884901888
maximum_root_seconds = 3600.0
maximum_cohort_seconds = 7200.0
maximum_output_bytes = 68719476736
minimum_free_disk_bytes = 2147483648

[branches]
root_surface = "reward"
root_occurrence = 1
continuation_macro_decisions = 0
terminal_only = true
max_native_steps = 8192
max_candidates = 128
timeout_seconds = 1200.0
max_trace_bytes = 536870912
policy_atol = 0.000001
policy_rtol = 0.00001

[learner]
