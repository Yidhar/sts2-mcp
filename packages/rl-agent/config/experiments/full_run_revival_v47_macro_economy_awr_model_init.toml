# V47 factual macro-economy AWR successor to v46's immutable healthy-validation
# checkpoint at local environment step 10,035. This is an explicit
# encoding-v15 -> encoding-v16 model-parameter initialization: inherited
# network tensors are reviewed, while optimizer, replay, RNG and recurrent
# rollout state are intentionally fresh. Budget-40 and reward-v7 economics
# remain unchanged so the diagnostic isolates the new credit path.
#
# This lineage closes the measured "cannot say no" and macro-choice credit
# gaps without a hand-authored HP threshold, card/item identity, or preferred
# action:
#   1. Card take/skip, shop buy/leave/removal, and rest/upgrade use one factual
#      lifecycle contract through the next same-resource opportunity, Act
#      boundary, or authoritative terminal.
#   2. A candidate-independent macro value predicts only the executed factual
#      return. The residual actor uses AWR A=G-stopgrad(V_macro(s)); it never
#      invents an unexecuted alternative Q.
#   3. Shared state features and inherited base logits are detached from both
#      new heads, so macro credit cannot move the tactical/deck trunk.
#   4. A committed upgrade/removal teaches aggregate Select-branch completion;
#      exact card choice remains owned by factual AWR/Q labels.
#   5. Logged epsilon 0.10 is temporary only for reward-skip and clean
#      shop-leave data collection. There is no completion guidance or action
#      rewrite, and deterministic evaluation bypasses it.
#
# This is a 30k diagnostic, not an automatic production promotion. Acceptance
# requires non-zero admitted value/AWR labels on every encountered reviewed
# surface, reward-skip and affordable-shop-leave support above literal zero,
# committed selection-group labels, finite bounded weights, and no entropy,
# liveness, or tactical-regression signature on paired seeds.
[optimization]
learning_rate = 0.0001
entropy_weight = 0.006
entropy_weight_end = 0.004
entropy_decay_updates = 3000
entropy_breaker = "policy-collapse-v2"

[rollout]
queue_capacity = 24

[transaction_learning]
enabled = true
replay_capacity = 4096
replay_byte_capacity = 1073741824
sample_traces = 4
burn_in_steps = 32
effect_weight = 0.05
# Per-candidate transaction Q re-enabled: with the simulator's new
# upgrade_preview facts and option-return labels on card-target steps,
# Q(select A) vs Q(select B) is the first target-specific short-horizon
# credit. Small weight; representation-shaping only, never action rewrite.
transaction_q_weight = 0.05
# Entry steps remain excluded from transaction-internal completion CE. The
# lifecycle corridor below only prevents numerical absorption at exact zero; it
# does not encode whether rest, forge, removal, or purchase is strategically
# preferable in a particular state.
completion_policy_weight = 0.15
pairwise_ranking_weight = 0.0
lifecycle_entry_support_weight = 0.0
lifecycle_entry_support_probability_floor = 0.05
lifecycle_smdp_q_weight = 0.10
# Extend each factual option through the next opportunity of the same resource
# family (rest, shop, or card reward), Act boundary, or authoritative run
# terminal. No learned post-state bootstrap is used, so this remains observed
# SMDP credit rather than a prediction target.
lifecycle_smdp_horizon = "next_resource_opportunity"
# The v46 candidate-Q actor bridge is disabled. Its fields remain explicit for
# config ABI clarity; v47 uses the isolated factual macro AWR path below.
lifecycle_advantage_policy_weight = 0.0
lifecycle_advantage_start_update = 256
lifecycle_advantage_temperature = 0.25
lifecycle_advantage_clip = 1.0
lifecycle_advantage_q_error_gate = 0.25
lifecycle_advantage_max_policy_lag = 128
lifecycle_advantage_max_log_probability_shift = 1.0
# V47 uses only executed factual option returns.  A candidate-independent
# zero-initialized baseline supplies A=G-V_macro(s); no unexecuted alternative
# Q estimate enters the actor. Rows are averaged within each resource surface
# and then equally across represented surfaces, preserving absolute AWR weights
# even for a singleton shop/rest sample. Both heads consume detached shared
# features, so the macro learner cannot displace tactical/deck-target
# competence through the shared trunk.
macro_option_value_weight = 0.10
macro_option_actor_weight = 0.03
macro_option_actor_temperature = 0.25
macro_option_actor_log_weight_clip = 2.0
macro_option_max_policy_lag = 128
macro_option_max_log_probability_shift = 2.0
# Committed upgrade/removal traces teach only aggregate Select-branch
# competence.  Which card is chosen remains factual AWR/Q supervision.
macro_option_group_completion_weight = 0.05

[failure_credit]
mode = "learning"
replay_capacity = 4096
replay_byte_capacity = 2147483648
sample_records = 4
burn_in_steps = 32
maximum_context_steps = 256
maximum_episode_completion_controls = 32
maximum_episode_completion_bytes = 134217728
direct_witness_quota = 0
multi_edge_cycle_quota = 0
risk_sequence_quota = 1
unresolved_stall_quota = 1
completion_control_quota = 1
matched_outcome_pair_quota = 1
maximum_matched_pairs_per_publication = 8
policy_gradient_max_lag = 128
liveness_head_calibration_updates = 256
liveness_risk_actor_start_update = 512
liveness_records_per_autograd_batch = 4
liveness_tbptt_window_steps = 16
liveness_maximum_contexts_per_record = 2
liveness_maximum_replayed_steps_per_update = 4096
liveness_maximum_replayed_candidates_per_update = 1048576
liveness_value_critic_weight = 0.10
liveness_cost_critic_weight = 0.25
liveness_cost_actor_weight = 0.10
liveness_direct_policy_weight = 0.25
liveness_cycle_policy_weight = 0.10
liveness_contrast_policy_weight = 0.10
liveness_completion_policy_weight = 0.15
liveness_risk_advantage_clip = 0.25
liveness_risk_actor_min_selected_probability = 0.01
liveness_contrast_margin = 0.10
liveness_gradient_clip_norm = 0.50

[episodic_learning]
fresh_policy_sequences = 1
# A failed run may imitate only a factually completed Act whose boundary
# resource receipt passes both health gates. This lower rung is 0.30x the
# complete-run policy weight; full victories remain dominant and all existing
# lag, trust-region and surface-exemption gates are reused. The 83-95%
# gate-suppression measured in v42 is the gate refusing genuinely mortgaged
# act-1 exits (8-20% HP), not a calibration fault; thresholds remain untouched
# in the budget-40 diagnostic.
act_segment_imitation_enabled = true
act_segment_policy_weight = 0.30
act_segment_min_exit_hp_ratio = 0.35
act_segment_max_revival_fraction = 0.34
# Bounded factual combat HP-loss auxiliary value. Its small weight teaches the
# shared state/deck representation without becoming a second primary actor.
combat_hp_loss_value_weight = 0.05
combat_hp_loss_reference = 80.0
success_policy_trust_region_epsilon = 0.20
success_imitation_exempt_surfaces = ["rest_site", "shop", "card_reward", "card_reward_selection", "upgrade_selection", "removal_selection"]

[curriculum]
revival_budget = 40
epsilon_start = 0.15
epsilon_end = 0.05
epsilon_decay_steps = 150000
# Temporary selection-surface exploration remains fully withdrawn in v43.
selection_surface_epsilon_floor = 0.0

[transaction_exploration]
# Temporary support only for the two saturated voluntary-decline branches.
# Multi-step upgrade/remove scaffolding remains fully withdrawn; guidance is
# structurally zero because these entrances have no selection surface.
enabled = true
operations = ["reward_skip", "shop_leave"]
entry_epsilon_floor = 0.10
completion_guidance_probability = 0.0

[runtime]
rocm_sdpa_backend = "math"
# Inherit v46's exploration schedule position at source step 10,035 rather than
# resetting epsilon to its initial value. Liveness calibration and risk-actor
# delay intentionally replay under the fresh v47 optimizer/replay state.
model_initialization_schedule_mode = "inherit"
model_initialization_liveness_schedule_mode = "reset"
total_environment_steps = 30000
# Preserve the held-out namespace so v44/v46/v47 evaluations remain paired.
seed = 6300000
log_dir = "runs/full-run-revival-v47-macro-economy-awr-model-init"
checkpoint_dir = "checkpoints/full-run-revival-v47-macro-economy-awr-model-init"
checkpoint_interval_steps = 5000
evaluation_steps = [0, 5000, 10000, 20000]
evaluation_episodes = 16
early_evaluation_steps = []
early_evaluation_episodes = 16
final_audit_steps = [30000]
final_audit_episodes = 16
evaluation_liveness_guard_enabled = false
evaluation_guard_min_liveness_episodes = 16
evaluation_guard_liveness_baseline_failures = 0
evaluation_guard_liveness_baseline_episodes = 16
evaluation_guard_min_liveness_regression_rate = 0.20
training_deadlock_streak_alert_episodes = 4
# This is a stop-only safety breaker. Rollback/replay of a discarded policy
# segment remains disabled, so a newly learned strategy is never silently
# replaced by an earlier gate checkpoint.
evaluation_guard_enforcement_start_steps = 0
evaluation_guard_failure_action = "stop"
evaluation_guard_max_rollbacks = 0
