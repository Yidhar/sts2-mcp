# Exact continuation of the completed v29 100k checkpoint.
#
# This overlay deliberately preserves every immutable model, optimization,
# rollout, replay, failure-credit, episodic-credit, curriculum, and seed
# setting from ``full_run_revival_v29_failure_credit_v4_model_init.toml``.
# It is valid only with ``--resume`` from the pinned v29 100k exact-resume
# contract; it is not a model-only initialization recipe.  The 350k horizon is
# absolute, so resuming the 100k source contributes exactly 250k new steps.

[optimization]
learning_rate = 0.0001
entropy_weight = 0.006
entropy_weight_end = 0.002
entropy_decay_updates = 3000

[rollout]
queue_capacity = 24

[transaction_learning]
# The source lineage retired transaction-v3.  Exact continuation must not
# silently re-enable or initialize those heads.
enabled = false

[failure_credit]
mode = "learning"
replay_capacity = 4096
replay_byte_capacity = 536870912
sample_records = 8
burn_in_steps = 32
maximum_context_steps = 256
maximum_episode_completion_controls = 32
maximum_episode_completion_bytes = 134217728
direct_witness_quota = 1
multi_edge_cycle_quota = 1
risk_sequence_quota = 1
unresolved_stall_quota = 1
completion_control_quota = 1
matched_outcome_pair_quota = 0
policy_gradient_max_lag = 128
liveness_head_calibration_updates = 256
liveness_risk_actor_start_update = 512
liveness_records_per_autograd_batch = 1
liveness_tbptt_window_steps = 16
liveness_maximum_contexts_per_record = 2
liveness_maximum_replayed_steps_per_update = 4096
liveness_maximum_replayed_candidates_per_update = 1048576
liveness_value_critic_weight = 0.10
liveness_cost_critic_weight = 0.25
liveness_cost_actor_weight = 0.10
liveness_direct_policy_weight = 0.25
liveness_cycle_policy_weight = 0.10
liveness_contrast_policy_weight = 0.10
liveness_completion_policy_weight = 0.0
liveness_risk_advantage_clip = 0.25
liveness_contrast_margin = 0.10

[episodic_learning]
fresh_policy_sequences = 1

[curriculum]
revival_budget = -1
epsilon_start = 0.15
epsilon_end = 0.05
epsilon_decay_steps = 150000

[runtime]
rocm_sdpa_backend = "math"
total_environment_steps = 350000
seed = 4000000
log_dir = "runs/full-run-revival-v29-failure-credit-v4-exact-continuation-350k"
checkpoint_dir = "checkpoints/full-run-revival-v29-failure-credit-v4-exact-continuation-350k"
checkpoint_interval_steps = 10000

# Completed gates remain in the schedule because their restored evaluation
# state is part of exact resume.  Removing them would make the next checkpoint
# unable to validate the inherited evaluation journal.
# 175k is a recovery-only observation gate.  It re-checks the 150k liveness
# regression five thousand steps after the 170119 atomic resume instead of
# allowing a degraded policy to run blind until 200k.
evaluation_steps = [0, 25000, 50000, 75000, 125000, 150000, 175000, 200000, 250000, 300000, 325000]
evaluation_episodes = 16
early_evaluation_steps = [5000, 10000, 110000]
early_evaluation_episodes = 8
final_audit_steps = [350000]
final_audit_episodes = 64
evaluation_liveness_guard_enabled = true
