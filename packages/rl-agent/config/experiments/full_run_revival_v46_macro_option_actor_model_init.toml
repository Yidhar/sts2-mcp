# V46 factual macro-option actor successor to v44's immutable healthy gate at
# local environment step 100,478 (the freshest guard-blessed state, carrying
# the best acts-2/3 revival increment measured so far: p50 19). Explicit
# config-v18/encoding-v14 -> config-v19/encoding-v15 model-initialization
# lineage; optimizer, replay, RNG and recurrent rollout state are intentionally
# fresh. Budget and reward-v7 economics stay unchanged at 40.
#
# This lineage closes the measured learning-path gap without a hand-authored
# rest/forge or card-name preference:
#   1. Native selectable cards expose exact one-upgrade alternative facts;
#      encoding-v15 binds them to the physical source relation.
#   2. Rest, forge and removal share a factual next-rest/Act option horizon;
#      card-selection rows own returns beginning at the selected card, not at
#      the earlier transaction entry.
#   3. A bounded direct actor bridge is admitted only after the selected
#      option Q is calibrated and policy provenance is recent. Its CE gradient
#      remains non-zero at a literal softmax zero, repairing the absorption
#      that defeated V-trace and importance-weighted imitation. Target,
#      baseline, strength and all gates are detached; only actor logits move.
#   4. Upgrade/remove behavior scaffolding remains withdrawn. The only
#      temporary exploration is v45's 0.15 bootstrap for reward skip and relic
#      purchase, both single-decision branches with zero completion guidance.
#
# Acceptance for v46 (paired seeds): skip rate > 0 with deck size p50 down
# from 26 toward <= 22; relic purchases >= 1 per 4 episodes by 50k;
# forge-target basics share falling from 58% (D3a effect); acts-2/3 revival
# increment p50 <= 15; eval wins >= v44's 2-5/16; no collapse signature.
[optimization]
learning_rate = 0.0001
entropy_weight = 0.006
entropy_weight_end = 0.004
entropy_decay_updates = 3000
entropy_breaker = "policy-collapse-v2"

[rollout]
queue_capacity = 24

[transaction_learning]
enabled = true
replay_capacity = 4096
replay_byte_capacity = 1073741824
sample_traces = 4
burn_in_steps = 32
effect_weight = 0.05
# Per-candidate transaction Q re-enabled: with the simulator's new
# upgrade_preview facts and option-return labels on card-target steps,
# Q(select A) vs Q(select B) is the first target-specific short-horizon
# credit. Small weight; representation-shaping only, never action rewrite.
transaction_q_weight = 0.05
# Entry steps remain excluded from transaction-internal completion CE. The
# lifecycle corridor below only prevents numerical absorption at exact zero; it
# does not encode whether rest, forge, removal, or purchase is strategically
# preferable in a particular state.
completion_policy_weight = 0.15
pairwise_ranking_weight = 0.0
lifecycle_entry_support_weight = 0.05
lifecycle_entry_support_probability_floor = 0.05
lifecycle_smdp_q_weight = 0.10
# Extend the factual entry option through the next rest-site arrival, Act
# boundary, or authoritative run terminal. No learned post-state bootstrap is
# used, so this remains observed SMDP credit rather than a prediction target.
lifecycle_smdp_horizon = "next_rest_or_act"
# Direct option-advantage policy credit. The small coefficient and hard
# admission gates prevent an uncalibrated transaction Q head from moving the
# shared actor. Update 256 corresponds to roughly 16k environment steps at the
# maintained 64-step learner cadence, allowing the factual Q heads to settle.
lifecycle_advantage_policy_weight = 0.05
lifecycle_advantage_start_update = 256
lifecycle_advantage_temperature = 0.25
lifecycle_advantage_clip = 1.0
lifecycle_advantage_q_error_gate = 0.25
lifecycle_advantage_max_policy_lag = 128
lifecycle_advantage_max_log_probability_shift = 1.0

[failure_credit]
mode = "learning"
replay_capacity = 4096
replay_byte_capacity = 2147483648
sample_records = 4
burn_in_steps = 32
maximum_context_steps = 256
maximum_episode_completion_controls = 32
maximum_episode_completion_bytes = 134217728
direct_witness_quota = 0
multi_edge_cycle_quota = 0
risk_sequence_quota = 1
unresolved_stall_quota = 1
completion_control_quota = 1
matched_outcome_pair_quota = 1
maximum_matched_pairs_per_publication = 8
policy_gradient_max_lag = 128
liveness_head_calibration_updates = 256
liveness_risk_actor_start_update = 512
liveness_records_per_autograd_batch = 4
liveness_tbptt_window_steps = 16
liveness_maximum_contexts_per_record = 2
liveness_maximum_replayed_steps_per_update = 4096
liveness_maximum_replayed_candidates_per_update = 1048576
liveness_value_critic_weight = 0.10
liveness_cost_critic_weight = 0.25
liveness_cost_actor_weight = 0.10
liveness_direct_policy_weight = 0.25
liveness_cycle_policy_weight = 0.10
liveness_contrast_policy_weight = 0.10
liveness_completion_policy_weight = 0.15
liveness_risk_advantage_clip = 0.25
liveness_risk_actor_min_selected_probability = 0.01
liveness_contrast_margin = 0.10
liveness_gradient_clip_norm = 0.50

[episodic_learning]
fresh_policy_sequences = 1
# A failed run may imitate only a factually completed Act whose boundary
# resource receipt passes both health gates. This lower rung is 0.30x the
# complete-run policy weight; full victories remain dominant and all existing
# lag, trust-region and surface-exemption gates are reused. The 83-95%
# gate-suppression measured in v42 is the gate refusing genuinely mortgaged
# act-1 exits (8-20% HP), not a calibration fault; thresholds stay untouched
# and are expected to pass more often as budget-48 economics heal boundary HP.
act_segment_imitation_enabled = true
act_segment_policy_weight = 0.30
act_segment_min_exit_hp_ratio = 0.35
act_segment_max_revival_fraction = 0.34
# Bounded factual combat HP-loss auxiliary value. Its small weight teaches the
# shared state/deck representation without becoming a second primary actor.
combat_hp_loss_value_weight = 0.05
combat_hp_loss_reference = 80.0
success_policy_trust_region_epsilon = 0.20
success_imitation_exempt_surfaces = ["rest_site", "shop"]

[curriculum]
revival_budget = 40
epsilon_start = 0.15
epsilon_end = 0.05
epsilon_decay_steps = 150000
# Temporary selection-surface exploration remains fully withdrawn in v43.
selection_surface_epsilon_floor = 0.0

[transaction_exploration]
# Stage-one bootstrap for the two reviewed single-decision entrances. The
# multi-step upgrade/remove scaffolding remains fully withdrawn; guidance is
# structurally zero because these entrances have no selection surface.
enabled = true
operations = ["reward_skip", "relic_purchase"]
entry_epsilon_floor = 0.15
completion_guidance_probability = 0.0

[runtime]
rocm_sdpa_backend = "math"
# Inherit v44's mid-decay exploration clock (~100k effective: epsilon ~0.083
# continuing to 0.05); resetting that schedule would add an unrelated
# exploration shock while this lineage measures a new macro-credit path.
# Liveness calibration and the risk-actor delay intentionally replay under the
# fresh v46 optimizer/replay state.
model_initialization_schedule_mode = "inherit"
model_initialization_liveness_schedule_mode = "reset"
total_environment_steps = 250000
# Preserve the held-out seed namespace so v44->v46 evaluation stays paired.
seed = 6300000
log_dir = "runs/full-run-revival-v46-macro-option-actor-model-init"
checkpoint_dir = "checkpoints/full-run-revival-v46-macro-option-actor-model-init"
checkpoint_interval_steps = 10000
evaluation_steps = [0, 50000, 100000, 150000, 200000]
evaluation_episodes = 16
early_evaluation_steps = [10000, 25000, 75000, 125000, 175000, 225000]
early_evaluation_episodes = 16
final_audit_steps = [250000]
final_audit_episodes = 64
evaluation_liveness_guard_enabled = true
evaluation_guard_min_liveness_episodes = 16
evaluation_guard_liveness_baseline_failures = 0
evaluation_guard_liveness_baseline_episodes = 16
evaluation_guard_min_liveness_regression_rate = 0.20
training_deadlock_streak_alert_episodes = 4
# This is a stop-only safety breaker. Rollback/replay of a discarded policy
# segment remains disabled, so a newly learned strategy is never silently
# replaced by an earlier gate checkpoint.
evaluation_guard_enforcement_start_steps = 10000
evaluation_guard_failure_action = "stop"
evaluation_guard_max_rollbacks = 0
