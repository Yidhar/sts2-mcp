# Durable Afterstate Macro Credit v8.0 — Lock Good Base + Parallel Same-Seed CRN Counterfactual Roots + Golden-Zone Combat
# Warm-starts from v7.5 u=10 (12/48 = 25.0% on fixed seed=6760000; intact v7.3 u=80 macro routing/events,
# 5 updates of rebalanced combat +1.5/-1.5/1.2, and 10 updates of calibrated active durable vitals gates -> 0 fresh tensors).
# Key architectural upgrades over v7.5:
# 1. Zero Map/Event Fallback Drift (`macro_pg_fallback_scale = 0.0`, `macro_entropy_weight = 0.0`):
#    Completely disables fallback PG & fallback entropy on Map/Event/Shop steps, locking v7.3/v7.5's already-strong
#    16.02-floor Act-1 routing and event strategy instead of walking into 2x Elites on un-upgraded decks.
# 2. Parallel Same-Seed CRN Counterfactual Branches (`crn_roots_per_episode = 1`, `crn_max_branches_per_root = 4`,
#    `roots_per_cohort = 32`, `parallel_collectors = 48`):
#    For each episode, samples 1 Card Reward (~70%) or Campfire (~30%) decision and executes all legal branches
#    (Card 1 / Card 2 / Card 3 / Skip, or Heal vs top-3 Smith candidates) from the EXACT same state, deck, HP, and
#    RNG seed to Act-1 terminal. Eliminates cross-seed noise, 1/16 draw dilution, and Twin disagreement noise.
# 3. Direct Empirical CRN Macro MPO (`crn_only_macro_mpo = true`, `minority_only_within_branch_mpo = false`) +
#    Centered Pairwise Delta-V Supervision (`crn_pairwise_value_weight = 1.0`) + Unchained `durable_deck_synergy_*` 3x LR:
#    Projects Macro MPO directly onto empirical CRN returns (normalized by active CRN roots, not 1800 silent steps),
#    while training V_durable + durable_deck_synergy_* on centered (V_k - mean V) vs (R_k - mean R) where v_stage cancels identically.
# 4. Combat Locked in Golden Zone (`combat_pg_kl_weight = 0.02`, `combat_entropy_weight = 0.007`, `target_combat_step_kl = 0.020`):
#    Prevents late-run defensive degradation while continuing to refine lethal blocking and boss pacing.
# 5. High-Precision 96-Seed Held-Out Evaluation (`training.runtime.seed = 6760000`, `--heldout-episodes 96`):
#    Cuts 1-sigma evaluation noise from +-6.5% (n=48) down to +-4.0% (n=96) against the 19.8% (19/96) baseline.
version = "sts2-synchronous-macro-credit-course-v1"

[course]
roots_per_cohort = 32
seed_index_offset = 830000
parallel_collectors = 48
macro_branch_epsilon = 0.04
crn_roots_per_episode = 1
crn_max_branches_per_root = 4
maximum_root_snapshot_bytes = 536870912
maximum_cohort_snapshot_bytes = 8589934592
maximum_root_seconds = 3600.0
maximum_cohort_seconds = 7200.0
maximum_output_bytes = 68719476736
minimum_free_disk_bytes = 2147483648

[branches]
root_surface = "reward"
root_occurrence = 1
continuation_macro_decisions = 0
terminal_only = true
max_native_steps = 8192
max_candidates = 128
timeout_seconds = 1200.0
max_trace_bytes = 536870912
policy_atol = 0.000001
policy_rtol = 0.00001

[learner]
target_mode = "durable_afterstate_v2"
domain_layers = 2
joint_layers = 3
enable_direct_vitals_context = true
enable_direct_combat_vitals_context = true
enable_active_durable_vitals_gates = true
enable_macro_branch_prior = true
enable_persistent_only_durable_value = true
