# Durable Afterstate Macro Credit v4.4 (b32) — Deconfounded Intensive V_durable + Partial Shop/Selection Afterstates + Hierarchical MPO
# Tuned for 48-thread AMD EPYC 9B45 + NVIDIA RTX PRO 6000 Blackwell (96 GB VRAM, 600W):
# 1. Progress-Conditioned & Size-Deconfounded Intensive V_durable (enable_deconfounded_durable_value = true, durable_v6):
#    Makes V_durable an exact degree-0 intensive functional of the draw distribution p_i = q_i / N_deck by removing
#    raw N_deck shortcuts (retired durable_deck_size_* and constant deck_seq_mask slot[1]) while conditioning a
#    dedicated zero-init durable_progress_vitals_head explicitly on exact root (floor, act, hp_ratio, gold,
#    open_potions, critic_revival_context). Eliminates the observational N_deck -> floor and low_hp -> Floor_1
#    confounding shortcuts so Card Take/Skip and Shop Remove reflect genuine marginal deck quality.
# 2. Partial Deterministic Shop/Rest Afterstates + Selection Afterstates (enable_partial_afterstates = true):
#    Synthesizes exact subset afterstate nodes on shops containing stochastic pickup-effect relics (preserving
#    q(j) == pi_teacher(j) outside D, with empirical V-trace PG fallback when j not in D is sampled) and adds
#    exact deterministic afterstates on single-card DeckUpgrade / DeckRemove selection screens.
# 3. Two-Level Hierarchical Afterstate MPO + Minimum Temperature Regularization (enable_hierarchical_afterstate_mpo = true):
#    Solves conditional within-branch MPO pi*(. | D_b) before branch-marginal MPO P*(b), adds unattenuated within-branch
#    cross-entropy supervision so minority branches (e.g. shop:remove, rest:smith) learn accurate card polarity even
#    when P(b) is small, and enforces eta >= macro_mpo_min_temperature = 0.008 so sub-millipoint critic noise cannot
#    saturate the KL trust region.
version = "sts2-synchronous-macro-credit-course-v1"

[course]
roots_per_cohort = 48
seed_index_offset = 120000
parallel_collectors = 48
macro_branch_epsilon = 0.04
maximum_root_snapshot_bytes = 536870912
maximum_cohort_snapshot_bytes = 8589934592
maximum_root_seconds = 3600.0
maximum_cohort_seconds = 7200.0
maximum_output_bytes = 68719476736
minimum_free_disk_bytes = 2147483648

[branches]
root_surface = "reward"
root_occurrence = 1
continuation_macro_decisions = 0
terminal_only = true
max_native_steps = 8192
max_candidates = 128
timeout_seconds = 1200.0
max_trace_bytes = 536870912
policy_atol = 0.000001
policy_rtol = 0.00001

[learner]
target_mode = "durable_afterstate_v2"
enable_direct_vitals_context = true
enable_macro_branch_prior = true
enable_persistent_only_durable_value = true
enable_asymmetric_revival_critic = true
enable_draw_weighted_durable_value = true
enable_role_conditioned_candidate_policy = true
enable_deconfounded_durable_value = true
enable_partial_afterstates = true
enable_hierarchical_afterstate_mpo = true
macro_mpo_min_temperature = 0.008
macro_within_branch_kl = 0.04
macro_within_branch_mpo_weight = 0.50
revival_budget = 32
zero_macro_pace_penalty = true
clip_macro_pg_fallback = true
macro_pg_clip_eps = 0.20
macro_pg_adv_clip = 0.25
macro_pg_kl_weight = 0.05
macro_pg_within_branch_entropy_only = true
separate_value_grad_clip = true
learning_rate = 0.00015
shared_learning_rate_scale = 0.25
weight_decay = 0.01
macro_trace_lambda = 0.95
macro_kl = 0.03
durable_warmup_updates = 4
combat_actor_warmup_updates = 8
macro_entropy_weight = 0.010
durable_post_value_weight = 0.5
chunk_steps = 16
combat_unroll_steps = 16
eval_batch_size = 48
chunk_batch_size = 96
allow_tf32 = false
macro_policy_weight = 1.0
macro_value_weight = 0.5
combat_policy_weight = 0.25
combat_value_weight = 0.5
combat_entropy_weight = 0.0005
rho_clip = 1.1
c_clip = 1.0
policy_rho_clip = 1.1
gradient_clip_norm = 1.0
likelihood_tolerance = 0.02

[training.transaction_learning]
enabled = false

[training.failure_credit]
mode = "disabled"

[training.episodic_learning]
enabled = false

[training.rollout]
deterministic_probe_interval_episodes = 0
deterministic_probe_environment_steps = []

[training.curriculum]
revival_budget = 32
epsilon_start = 0.0
epsilon_end = 0.0

[training.runtime]
rocm_sdpa_backend = "math"
seed = 6700000
evaluation_steps = []
early_evaluation_steps = []
final_audit_steps = []
evaluation_liveness_guard_enabled = false
