# Capacity-stable replay-v5 successor to the frozen v30 policy at environment
# step 30,200. The launcher is model-initialization only: network parameters
# are inherited while optimizer, replay corpora, RNG, rollout queues, counters
# and evaluation journals start in a new lineage. This is intentionally not an
# exact resume because the failure replay byte-capacity contract changed.

[optimization]
learning_rate = 0.0001
entropy_weight = 0.006
entropy_weight_end = 0.002
entropy_decay_updates = 3000

[rollout]
queue_capacity = 24

[transaction_learning]
# Failure-credit v5 is the sole transaction/deadlock learning plane.
enabled = false

[failure_credit]
mode = "learning"
replay_capacity = 4096
replay_byte_capacity = 2147483648
# Keep the reviewed 256-step semantic evidence horizon. Online v30 records
# reached about 89 MiB because collision-auditable node identities dominate
# storage; truncating the context would discard causal evidence. The 2 GiB
# host-memory budget matches episodic replay and prevents 512 MiB churn.
sample_records = 8
burn_in_steps = 32
maximum_context_steps = 256
maximum_episode_completion_controls = 32
maximum_episode_completion_bytes = 134217728
direct_witness_quota = 1
multi_edge_cycle_quota = 1
risk_sequence_quota = 1
unresolved_stall_quota = 1
completion_control_quota = 1
matched_outcome_pair_quota = 1
maximum_matched_pairs_per_publication = 8
policy_gradient_max_lag = 128
liveness_head_calibration_updates = 256
liveness_risk_actor_start_update = 512
liveness_records_per_autograd_batch = 1
liveness_tbptt_window_steps = 16
liveness_maximum_contexts_per_record = 2
liveness_maximum_replayed_steps_per_update = 4096
liveness_maximum_replayed_candidates_per_update = 1048576
liveness_value_critic_weight = 0.10
liveness_cost_critic_weight = 0.25
liveness_cost_actor_weight = 0.10
liveness_direct_policy_weight = 0.25
liveness_cycle_policy_weight = 0.10
liveness_contrast_policy_weight = 0.10
liveness_completion_policy_weight = 0.0
liveness_risk_advantage_clip = 0.25
liveness_contrast_margin = 0.10

[episodic_learning]
fresh_policy_sequences = 1

[curriculum]
# Preserve complete-run coverage and unlimited engine-native revival during
# recovery of the causal policy signal.  Revival remains an explicit episodic
# cost; it is not counted as durable progress.
revival_budget = -1
epsilon_start = 0.15
epsilon_end = 0.05
epsilon_decay_steps = 150000

[runtime]
rocm_sdpa_backend = "math"
total_environment_steps = 250000
seed = 5000000
log_dir = "runs/full-run-revival-v31-failure-credit-capacity-model-init"
checkpoint_dir = "checkpoints/full-run-revival-v31-failure-credit-capacity-model-init"
checkpoint_interval_steps = 10000
evaluation_steps = [0, 25000, 50000, 75000, 100000, 150000, 200000]
evaluation_episodes = 16
early_evaluation_steps = [5000, 10000]
early_evaluation_episodes = 8
final_audit_steps = [250000]
final_audit_episodes = 64
evaluation_liveness_guard_enabled = true
