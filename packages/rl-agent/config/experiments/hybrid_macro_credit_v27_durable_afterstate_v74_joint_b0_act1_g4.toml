# Durable Afterstate Macro Credit v7.4 — Joint Macro + Combat B=0 Act Curriculum (Stage 1b b0-act1 -> b0-act2 -> b0-act3)
# Warm-starts directly from v7.3 u=80 (12/48 = 25.0% B=0 Act-1, combat vitals Critic +0.732, campfire sensitivity +0.298).
# Root-cause upgrades over v7.3:
# 1. Unlock Macro Afterstate MPO under B=0 (`macro_actor_warmup_updates = 5`, `durable_warmup_updates = 5`,
#    `combat_actor_warmup_updates = 5`): breaks the frozen B=24 face-tank macro ceiling (3% skip rate, self-damage traps
#    like Bloodletting/Hemokinesis/Inferno, zero drafted block cards) that stalled v7.3 at 22.9-25.0% despite healthy combat.
# 2. Rebalanced Encounter-Local Combat Reward (`local_combat_win_reward = 1.5`, `local_combat_loss_reward = -1.5`,
#    `local_combat_hp_weight = 1.2`): winning a Boss fight at -40 HP now returns +0.90 (previously -0.25), eliminating
#    over-conservative turtling while keeping clear marginal block signal (+0.15 per 10 damage prevented).
# 3. Anti-Entropy Collapse & bf16 Likelihood Robustness (`combat_entropy_weight = 0.012`, `macro_entropy_weight = 0.002`,
#    `likelihood_tolerance = 0.15`, `mpo_parent_prior_mix = 0.04`): prevents sharp-logit c_ent collapse (~0.38) and
#    bf16 batched-vs-unbatched rounding aborts while keeping fast 1-Epoch x 2-Minibatch PPO + post-step KL line search.
version = "sts2-synchronous-macro-credit-course-v1"

[course]
roots_per_cohort = 64
seed_index_offset = 765000
parallel_collectors = 48
macro_branch_epsilon = 0.04
maximum_root_snapshot_bytes = 536870912
maximum_cohort_snapshot_bytes = 8589934592
maximum_root_seconds = 3600.0
maximum_cohort_seconds = 7200.0
maximum_output_bytes = 68719476736
minimum_free_disk_bytes = 2147483648

[branches]
root_surface = "reward"
root_occurrence = 1
continuation_macro_decisions = 0
terminal_only = true
max_native_steps = 8192
max_candidates = 128
timeout_seconds = 1200.0
max_trace_bytes = 536870912
policy_atol = 0.000001
policy_rtol = 0.00001

[learner]
target_mode = "durable_afterstate_v2"
domain_layers = 2
joint_layers = 3
enable_direct_vitals_context = true
enable_direct_combat_vitals_context = true
enable_macro_branch_prior = true
enable_persistent_only_durable_value = true
enable_asymmetric_revival_critic = true
enable_draw_weighted_durable_value = true
enable_role_conditioned_candidate_policy = true
enable_deconfounded_durable_value = true
enable_monotone_deconfounded_durable_value = true
enable_balanced_deconfounded_durable_value = true
enable_expressive_synergy_backbone = true
enable_debloated_synergy_durable_value = true
enable_build_conditioned_durable_value = true
enable_twin_durable_value_heads = true
double_mpo_pessimism_coef = 0.40
ppo_epochs_per_cohort = 1
ppo_minibatches_per_cohort = 2
freeze_trunk_during_durable_warmup = true
durable_warmup_updates = 5
combat_actor_warmup_updates = 5
macro_actor_warmup_updates = 5
linear_hp_loss_weight = 0.50
hp_loss_reference = 80.0
enable_local_combat_critic = true
local_combat_win_reward = 1.5
local_combat_loss_reward = -1.5
local_combat_hp_weight = 1.2
local_combat_step_penalty = 0.002
local_combat_discount = 0.99
local_combat_trace_lambda = 0.95
local_combat_value_lr_scale = 3.0
normalize_combat_advantages = true
kickstart_combat_kl_scale = 0.0
target_combat_step_kl = 0.025
detach_value_heads_from_trunk = true
detach_macro_branch_prior_lse = true
isolate_nonreward_macro_trunk_grads = true
minority_only_within_branch_mpo = true
within_branch_minority_prob_cap = 0.30
macro_pg_fallback_scale = 0.15
mpo_parent_prior_mix = 0.04
max_parent_macro_kl = 0.0
enable_post_step_kl_line_search = true
target_macro_step_kl = 0.015
line_search_max_backtracks = 5
line_search_min_scale = 0.0625
macro_mpo_trust_kl_weight = 0.0
enable_partial_afterstates = true
enable_partial_afterstate_conditional_mpo = true
enable_manual_confirm_selection_afterstates = true
durable_stage_baseline_weight = 0.25
enable_hierarchical_afterstate_mpo = true
macro_mpo_min_temperature = 0.015
macro_within_branch_kl = 0.035
macro_within_branch_mpo_weight = 0.60
revival_budget = 0
zero_macro_pace_penalty = true
clip_macro_pg_fallback = true
macro_pg_clip_eps = 0.20
macro_pg_adv_clip = 0.25
macro_pg_kl_weight = 0.05
macro_pg_within_branch_entropy_only = true
clip_combat_pg = true
combat_pg_clip_eps = 0.15
combat_pg_adv_clip = 2.50
combat_pg_kl_weight = 0.005
separate_value_grad_clip = true
learning_rate = 0.000120
shared_learning_rate_scale = 0.25
weight_decay = 0.01
macro_trace_lambda = 0.95
macro_kl = 0.015
distill_teacher_rollout_updates = 0
distill_total_updates = 0
distill_epochs_per_cohort = 2
distill_policy_kl_weight = 1.0
distill_value_weight = 0.5
distill_afterstate_margin_weight = 1.0
kickstart_kl_weight = 0.020
kickstart_kl_floor = 0.005
macro_entropy_weight = 0.0020
durable_post_value_weight = 0.5
chunk_steps = 16
combat_unroll_steps = 16
eval_batch_size = 64
chunk_batch_size = 64
allow_tf32 = true
enable_bf16_amp = true
macro_policy_weight = 1.0
macro_value_weight = 0.5
combat_policy_weight = 1.0
combat_value_weight = 0.5
combat_entropy_weight = 0.0120
rho_clip = 1.1
c_clip = 1.0
policy_rho_clip = 1.1
gradient_clip_norm = 1.0
likelihood_tolerance = 0.15

[training.model]
d_model = 256
n_heads = 8
ffn_dim = 1024
world_layers = 4
latent_slots = 24
latent_layers = 3
local_layers = 2
candidate_layers = 2
recurrent_hidden_dim = 512
max_world_tokens = 4096

[training.transaction_learning]
enabled = false

[training.failure_credit]
mode = "disabled"

[training.episodic_learning]
enabled = false

[training.rollout]
deterministic_probe_interval_episodes = 0
deterministic_probe_environment_steps = []

[training.curriculum]
