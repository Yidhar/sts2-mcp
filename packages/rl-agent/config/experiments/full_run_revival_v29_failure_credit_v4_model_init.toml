# Formal successor to the frozen v28 100k policy.
#
# This file is an overlay on the maintained preheat profile.  The supervised
# v29 launcher pins the immutable v28 checkpoint and invokes only
# ``--initialize-from``.  Network parameters are inherited, the obsolete
# transaction-v3 heads are deliberately dropped, the two liveness heads are
# freshly initialized as one reviewed ABI group, and optimizer/replay/RNG/
# rollout/counters restart in a new lineage.

[optimization]
learning_rate = 0.0001
entropy_weight = 0.006
entropy_weight_end = 0.002
entropy_decay_updates = 3000

[rollout]
queue_capacity = 24

[transaction_learning]
# Retire the tail-reconstructed v3 AVOID path completely.  It is neither
# sampled nor checkpointed in this lineage.
enabled = false

[failure_credit]
mode = "learning"
replay_capacity = 4096
replay_byte_capacity = 536870912
sample_records = 8
burn_in_steps = 32
maximum_context_steps = 256
maximum_episode_completion_controls = 32
maximum_episode_completion_bytes = 134217728
direct_witness_quota = 1
multi_edge_cycle_quota = 1
risk_sequence_quota = 1
unresolved_stall_quota = 1
completion_control_quota = 1
matched_outcome_pair_quota = 0
policy_gradient_max_lag = 128
liveness_head_calibration_updates = 256
liveness_risk_actor_start_update = 512
liveness_records_per_autograd_batch = 1
liveness_tbptt_window_steps = 16
liveness_maximum_contexts_per_record = 2
liveness_maximum_replayed_steps_per_update = 4096
liveness_maximum_replayed_candidates_per_update = 1048576
liveness_value_critic_weight = 0.10
liveness_cost_critic_weight = 0.25
liveness_cost_actor_weight = 0.10
liveness_direct_policy_weight = 0.25
liveness_cycle_policy_weight = 0.10
liveness_contrast_policy_weight = 0.10
liveness_completion_policy_weight = 0.0
liveness_risk_advantage_clip = 0.25
liveness_contrast_margin = 0.10

[episodic_learning]
fresh_policy_sequences = 1

[curriculum]
# Start the new semantics/evidence lineage with complete-run coverage.  Revival
# remains engine-private and is still explicitly costed by episodic learning.
revival_budget = -1
epsilon_start = 0.15
epsilon_end = 0.05
epsilon_decay_steps = 150000

[runtime]
rocm_sdpa_backend = "math"
total_environment_steps = 100000
seed = 4000000
log_dir = "runs/full-run-revival-v29-failure-credit-v4-model-init"
checkpoint_dir = "checkpoints/full-run-revival-v29-failure-credit-v4-model-init"
checkpoint_interval_steps = 10000
evaluation_steps = [0, 25000, 50000, 75000]
evaluation_episodes = 16
early_evaluation_steps = [5000, 10000]
early_evaluation_episodes = 8
final_audit_steps = [100000]
final_audit_episodes = 64
evaluation_liveness_guard_enabled = true
