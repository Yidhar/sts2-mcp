version = "sts2-relational-curriculum-config-v20"
profile = "preheat"

[model]
architecture = "relational_candidate_v3"
token_feature_dim = 224
d_model = 128
n_heads = 4
ffn_dim = 384
world_layers = 3
latent_slots = 12
latent_layers = 2
local_layers = 1
candidate_layers = 1
recurrent_hidden_dim = 256
dropout = 0.05
type_vocab_size = 128
role_vocab_size = 64
owner_vocab_size = 128
entity_vocab_size = 8192
zone_vocab_size = 32
order_vocab_size = 128
domain_count = 8
max_world_tokens = 2048
max_candidates = 256
max_candidate_local_tokens = 64

[optimization]
learning_rate = 0.0003
weight_decay = 0.0001
batch_unrolls = 4
discount = 1.0
gradient_clip_norm = 1.0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
policy_rho_clip = 1.0
policy_weight = 1.0
value_weight = 0.5
entropy_weight = 0.02
entropy_weight_end = 0.004
entropy_decay_updates = 2000

[rollout]
unroll_length = 16
queue_capacity = 64
minimum_unrolls = 4
collector_workers = 1
policy_sync_interval_unrolls = 4
max_policy_lag = 64
deterministic_probe_interval_episodes = 16
deterministic_probe_environment_steps = [512, 1024, 2048, 4096]

[transaction_learning]
# Full-run preheat learns generic selection liveness from factual training traces.
enabled = true
replay_capacity = 4096
replay_byte_capacity = 536870912
sample_traces = 8
burn_in_steps = 24
effect_weight = 0.10
transaction_q_weight = 0.25
pairwise_ranking_weight = 0.10
pairwise_margin = 0.10
minimum_return_gap = 0.0
maximum_pairs = 256

[failure_credit]
# Historical transaction-v3 remains enabled for this frozen profile. Formal
# evidence v4 is disabled here and starts only in a reviewed successor.
mode = "disabled"
replay_capacity = 4096
replay_byte_capacity = 536870912
sample_records = 8
burn_in_steps = 32
maximum_context_steps = 256
direct_witness_quota = 1
multi_edge_cycle_quota = 1
risk_sequence_quota = 1
unresolved_stall_quota = 1
completion_control_quota = 1
liveness_value_critic_weight = 0.10
liveness_cost_critic_weight = 0.25

[episodic_learning]
# Complete episodes provide long-horizon labels while GPU autograd remains
# bounded to sample_sequences x learn_steps; burn-in is always no-grad.
enabled = true
replay_capacity_episodes = 64
replay_capacity_bytes = 2147483648
per_episode_capacity_bytes = 536870912
max_segments_per_episode = 8
sample_sequences = 2
burn_in_steps = 32
learn_steps = 32
# Reserve half of detached complete-episode replay suffixes for factual
# non-combat policy decisions. The remaining suffixes retain outcome-stratified
# whole-run coverage; FIFO V-trace collection remains unchanged.
macro_sample_fraction = 0.5
task_value_weight = 0.25
revival_value_weight = 0.02

[environment]
backend = "headless"
scenario = "full-run"
# Preserve one continuous native run long enough to traverse Acts 1--3. Exact
# semantic deadlock detection remains the fast escape hatch for reversible UI
# cycles; this outer bound is only a final transport-safety ceiling.
max_episode_steps = 30000

[curriculum]
mode = "native-revival-preheat"
reward_objective = "run"
revival_mechanism = "engine-bailout-v1"
revival_budget = -1
epsilon_start = 0.70
epsilon_end = 0.10
epsilon_decay_steps = 100000

[runtime]
device = "auto"
collector_device = "cpu"
total_environment_steps = 250000
seed = 0
log_dir = "runs/full-run-revival-v20-liveness-guard"
checkpoint_dir = "checkpoints/full-run-revival-v20-liveness-guard"
checkpoint_interval_steps = 10000
# A model-initialization lineage starts at step zero even when its network
# parameters came from an older policy. Validate that inherited policy on a
# fixed, statistically useful held-out seed prefix before collecting updates.
evaluation_steps = [0, 100000]
evaluation_episodes = 12
early_evaluation_steps = [5000, 10000, 20000, 30000]
early_evaluation_episodes = 4
final_audit_steps = [250000]
final_audit_episodes = 20
evaluation_liveness_guard_enabled = true
evaluation_guard_min_confirm_ready = 8
evaluation_guard_min_multi_action_end_turn = 32
evaluation_guard_max_confirm_failure_rate = 0.95
evaluation_guard_max_multi_action_end_turn_rate = 0.75
evaluation_guard_max_selection_cycle_episode_rate = 0.75

[diagnostics]
deadlock_window = 128
deadlock_repeat_threshold = 8
combat_net_progress_window = 256
combat_net_progress_room_windows = { TEST_SUBJECT_BOSS = 128 }
combat_net_progress_encounter_windows = {}
noncombat_durable_progress_window = 256
combat_min_net_hp_fraction = 0.05
journal_policy_topk = 5
