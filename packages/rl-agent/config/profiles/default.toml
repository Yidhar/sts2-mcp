version = "sts2-relational-curriculum-config-v11"
profile = "default"

[model]
architecture = "relational_candidate_v3"
token_feature_dim = 224
d_model = 128
n_heads = 4
ffn_dim = 384
world_layers = 3
latent_slots = 12
latent_layers = 2
local_layers = 1
candidate_layers = 1
recurrent_hidden_dim = 256
dropout = 0.05
type_vocab_size = 128
role_vocab_size = 64
owner_vocab_size = 128
entity_vocab_size = 8192
zone_vocab_size = 32
order_vocab_size = 128
domain_count = 8
max_world_tokens = 2048
max_candidates = 256
max_candidate_local_tokens = 64

[optimization]
learning_rate = 0.0003
weight_decay = 0.0001
batch_unrolls = 8
discount = 0.997
gradient_clip_norm = 1.0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
policy_rho_clip = 1.0
policy_weight = 1.0
value_weight = 0.5
entropy_weight = 0.01
entropy_weight_end = 0.01
entropy_decay_updates = 2000

[rollout]
unroll_length = 64
queue_capacity = 64
minimum_unrolls = 8
collector_workers = 1
policy_sync_interval_unrolls = 8
max_policy_lag = 64
deterministic_probe_interval_episodes = 0
deterministic_probe_environment_steps = []

[transaction_learning]
enabled = false
replay_capacity = 4096
replay_byte_capacity = 536870912
sample_traces = 8
burn_in_steps = 24
effect_weight = 0.10
transaction_q_weight = 0.25
completion_policy_weight = 0.25
pairwise_ranking_weight = 0.0
pairwise_margin = 0.10
minimum_return_gap = 0.0
maximum_pairs = 256

[episodic_learning]
# Complete episodes provide long-horizon labels while GPU autograd remains
# bounded to sample_sequences x learn_steps; burn-in is always no-grad.
enabled = false
replay_capacity_episodes = 64
replay_capacity_bytes = 2147483648
per_episode_capacity_bytes = 536870912
max_segments_per_episode = 8
sample_sequences = 2
fresh_policy_sequences = 0
burn_in_steps = 32
learn_steps = 32
primary_policy_weight = 0.25
task_value_weight = 0.25
revival_value_weight = 0.10
revival_policy_weight = 0.05
secondary_advantage_fraction = 0.25
primary_success_tie_tolerance = 0.05
importance_ratio_clip = 1.0
policy_gradient_max_lag = 128

[environment]
backend = "headless"
scenario = "full-run"
max_episode_steps = 10000

[curriculum]
mode = "standard"
reward_objective = "run"
epsilon_start = 0.30
epsilon_end = 0.05
epsilon_decay_steps = 250000

[runtime]
device = "auto"
collector_device = "cpu"
total_environment_steps = 1000000
seed = 0
log_dir = "runs/recurrent-vtrace-v9-long-horizon-heads"
checkpoint_dir = "checkpoints/recurrent-vtrace-v9-long-horizon-heads"
checkpoint_interval_steps = 25000
evaluation_steps = [0, 10000, 25000, 50000]
evaluation_episodes = 20

[diagnostics]
deadlock_window = 128
deadlock_repeat_threshold = 8
combat_net_progress_window = 256
combat_net_progress_room_windows = {}
combat_net_progress_encounter_windows = {}
noncombat_durable_progress_window = 256
combat_min_net_hp_fraction = 0.05
journal_policy_topk = 5
