version = "sts2-relational-curriculum-config-v3"
profile = "combat"

[model]
architecture = "relational_candidate_v3"
token_feature_dim = 224
d_model = 128
n_heads = 4
ffn_dim = 384
world_layers = 3
latent_slots = 12
latent_layers = 2
local_layers = 1
candidate_layers = 1
recurrent_hidden_dim = 256
dropout = 0.05
type_vocab_size = 128
role_vocab_size = 64
owner_vocab_size = 128
entity_vocab_size = 8192
zone_vocab_size = 32
order_vocab_size = 128
domain_count = 8
max_world_tokens = 2048
max_candidates = 256
max_candidate_local_tokens = 64

[optimization]
learning_rate = 0.0003
weight_decay = 0.0001
batch_unrolls = 8
discount = 0.997
gradient_clip_norm = 1.0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
policy_rho_clip = 1.0
policy_weight = 1.0
value_weight = 0.5
entropy_weight = 0.01

[rollout]
unroll_length = 64
queue_capacity = 256
minimum_unrolls = 8
collector_workers = 1
policy_sync_interval_unrolls = 8
max_policy_lag = 1024

[environment]
backend = "headless"
scenario = "combat"
max_episode_steps = 3000

[curriculum]
mode = "standard"
reward_objective = "combat"
epsilon_start = 0.30
epsilon_end = 0.05
epsilon_decay_steps = 100000

[runtime]
device = "auto"
collector_device = "cpu"
total_environment_steps = 250000
seed = 0
log_dir = "runs/recurrent-vtrace-combat-v6-runtime-mechanics"
checkpoint_dir = "checkpoints/recurrent-vtrace-combat-v6-runtime-mechanics"
checkpoint_interval_steps = 25000
evaluation_steps = [0, 10000, 25000, 50000]
evaluation_episodes = 50

[diagnostics]
deadlock_window = 128
deadlock_repeat_threshold = 8
combat_net_progress_window = 256
combat_min_net_hp_fraction = 0.05
journal_policy_topk = 5
