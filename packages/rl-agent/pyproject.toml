[build-system]
requires = [
  "setuptools==75.8.0",
  "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "sts2-rl"
version = "0.4.0"
description = "Grounded legal-candidate actor-critic baseline for Slay the Spire 2"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.3",
  "requests==2.33.0",
]

[project.optional-dependencies]
train = [
  "torch==2.11.0+cpu",
]
test = [
  "pytest==8.3.4",
  "jsonschema==4.25.1",
]
dev = [
  "mypy==1.13.0",
  "ruff==0.8.4",
  "types-requests==2.32.0.20241016",
]

[project.scripts]
sts2-train = "sts2_rl.train:main"
sts2-evaluate-checkpoint = "sts2_rl.evaluate_checkpoint:main"
sts2-monitor = "sts2_rl.monitor_dashboard:main"

[tool.setuptools]
py-modules = [
  "launcher",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sts2_rl*", "sts2_env*", "sts2_baseline*"]
exclude = ["tests*", "legacy*"]

[tool.setuptools.package-data]
sts2_rl = ["dashboard_static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "analysis",
  "logs_*",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sts2_rl", "sts2_baseline"]
pretty = true
show_error_codes = true
warn_unused_configs = true
[[tool.mypy.overrides]]
module = [
  "sts2_env.*",
]
follow_imports = "skip"
ignore_missing_imports = true
